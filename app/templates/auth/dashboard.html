<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | AXIODY</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="main">
    <section class="card" aria-labelledby="dashboard-title">
      <p class="step">Signed in</p>
      <h2 id="dashboard-title">Welcome to AXIODY</h2>
      <p class="intro">You are logged in as {{ email }}.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="message message-{{ category }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <a class="primary" href="{{ url_for('auth.logout') }}">Log out</a>
    </section>
  </main>
</body>
</html>
