<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AXIODY</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f8fc;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
        }

        .card {
            width: 420px;
            background: white;
            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.08);

            text-align: center;
        }

        .logo {
            width: 190px;
            margin-bottom: 35px;
        }

        h1 {
            color: #0b2147;
            margin-bottom: 12px;
        }

        p {
            color: #66758f;
            line-height: 1.5;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 28px;
            margin-bottom: 8px;

            font-weight: 600;
            color: #0b2147;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 15px;

            border: 1px solid #d4deed;
            border-radius: 10px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #1670f8;

            box-shadow: 0 0 0 3px rgba(22,112,248,0.12);
        }

        button {
            width: 100%;
            margin-top: 25px;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #1670f8;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #075bd2;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;

            color: #1670f8;
            text-decoration: none;
        }

        .error {
            margin-top: 14px;
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="card">

    <img
        src="{{ url_for('static', filename='images/axiody-logo.svg') }}"
        class="logo"
        alt="AXIODY"
    >

    <h1>Forgot Password?</h1>

    <p>
        Enter your email address and we'll send you
        a verification code.
    </p>

    <form method="POST">

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            value="{{ email | default('') }}"
            required
        >

        <button type="submit">
            Send Verification Code
        </button>

    </form>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <a href="{{ url_for('auth.login') }}" class="back-link">
        ← Back to Login
    </a>

</div>

</body>
</html>
