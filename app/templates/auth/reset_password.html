<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AXIODY</title>

    <style>

        body {
            margin: 0;

            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;

            background: #fff;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 430px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.08);
        }

        .logo {
            width: 190px;

            display: block;
            margin: 0 auto 35px;
        }

        h1 {
            color: #0b2147;
        }

        p {
            color: #66758f;
        }

        label {
            display: block;

            margin-top: 25px;
            margin-bottom: 8px;

            font-weight: 600;

            color: #0b2147;
        }

        input {
            width: 100%;

            box-sizing: border-box;

            padding: 15px;

            border: 1px solid #d4deed;
            border-radius: 10px;

            font-size: 16px;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 54px;
        }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 42px;
            height: 42px;
            margin: 0;
            padding: 9px;
            border: 0;
            background: transparent;
            color: #66758f;
        }

        .password-toggle:hover {
            background: #f2f8ff;
            color: #1670f8;
        }

        .password-toggle svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button {
            width: 100%;

            margin-top: 30px;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #1670f8;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .requirements {
            margin-top: 15px;

            background: #f2f8ff;

            padding: 15px;

            border-radius: 10px;

            color: #52647d;

            font-size: 14px;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="card">

    <img
        src="{{ url_for('static', filename='images/axiody-logo.svg') }}"
        class="logo"
        alt="AXIODY"
    >


    <h1>Reset Your Password</h1>

    <p>
        Enter your new password below.
    </p>


    <form method="POST">


        <label>New Password</label>

        <div class="password-field">
            <input id="new-password" type="password" name="password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show new password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>


        <label>Confirm New Password</label>

        <div class="password-field">
            <input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" required>
            <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password confirmation" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
        </div>


        <div class="requirements">

            Password must:

            <ul>
                <li>Contain at least 8 characters</li>
                <li>Include a letter</li>
                <li>Include a number</li>
                <li>Include a symbol</li>
            </ul>

        </div>


        <button type="submit">
            Reset Password
        </button>


    </form>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

</div>

<script>
document.querySelectorAll('[data-password-toggle]').forEach(button => {
    button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const visible = input.type === 'password';
        input.type = visible ? 'text' : 'password';
        button.setAttribute('aria-pressed', String(visible));
        button.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
    });
});
</script>

</body>

</html>
