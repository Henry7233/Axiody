{% extends "base.html" %}

{% block title %}Clients Needing Attention | AXIODY{% endblock %}

{% block head %}
<style>
  .clients-attention-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: fit-content;
    min-height: 40px;
    padding: 0 16px;
    border-radius: 8px;
    background: light-dark(#006eff, #0864ff);
    color: light-dark(#ffffff, #ffffff);
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    text-decoration: none;
    margin-bottom: 18px;
  }

  .clients-attention-back:hover {
    background: light-dark(#005bd1, #0b74ff);
  }
</style>
{% endblock %}

{% block content %}

<section class="dashboard-page">

  <a href="{{ url_for('admin.dashboard', period=selected_period) }}"
     class="clients-attention-back"
     aria-label="Go back to dashboard"
     title="Go back to dashboard">
    Back to Dashboard
  </a>

  <!-- CLIENTS NEEDING ATTENTION -->
  <article class="dashboard-card table-card">

    <div class="card-header">
      <div class="card-title-row">
        <div class="card-title-icon" aria-hidden="true">&#9888;</div>
        <h3>Clients Needing Attention</h3>
      </div>

      <a href="{{ url_for('admin.clients_attention', period=selected_period) }}" class="view-all-link">View all</a>
    </div>


    <div class="table-responsive">

      <table class="dashboard-table">

        <thead>
          <tr>
            <th>Client</th>
            <th>Document</th>
            <th>Reason</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          {% include "admin/_attention_rows.html" %}
        </tbody>

      </table>

    </div>

  </article>

</section>

{% endblock %}
