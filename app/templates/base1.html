<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AXIODY{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Navbar styles for the AXIODY header -->
  <style>
    :root {
      --axiody-blue: #0d63e8;
      --axiody-blue-soft: #eef5ff;
      --axiody-text: #0c1738;
      --axiody-muted: #586b8d;
      --axiody-border: #e8edf5;
      --axiody-header-height: 76px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
    }

    .skip-link:focus {
      left: 16px;
      top: 12px;
      z-index: 9999;
      background: #fff;
      color: var(--axiody-text);
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--axiody-border);
      box-shadow: 0 2px 10px rgba(31, 55, 92, 0.06);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      min-height: var(--axiody-header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 0 28px;
      max-width: 1440px;
      margin: 0 auto;
    }

    .site-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--axiody-text);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.8px;
      white-space: nowrap;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      display: block;
      flex: 0 0 auto;
    }

    .nav-links {
      display: flex;
      align-items: stretch;
      gap: 4px;
      list-style: none;
      margin: 0;
      padding: 0;
      min-height: var(--axiody-header-height);
    }

    .nav-links li {
      display: flex;
      align-items: stretch;
    }

    .nav-link {
      min-height: var(--axiody-header-height);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      color: var(--axiody-muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-bottom: 3px solid transparent;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .nav-link svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    .nav-link:hover {
      color: var(--axiody-blue);
      background: #f8fbff;
    }

    .nav-link[aria-current="page"] {
      color: var(--axiody-blue);
      background: var(--axiody-blue-soft);
      border-bottom-color: var(--axiody-blue);
      font-weight: 600;
    }

    .avatar-link {
      min-height: var(--axiody-header-height);
      padding-left: 12px;
      padding-right: 0;
      border-bottom: 0;
      background: transparent !important;
    }

    .avatar-link:hover {
      border-bottom-color: transparent;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ddecff;
      color: #0b5bc9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .site-content {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    .site-footer {
      margin-top: 48px;
    }

    .footer-inner {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
    }

    @media (max-width: 900px) {
      .navbar {
        padding: 0 18px;
      }

      .site-brand {
        font-size: 23px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
      }

      .nav-link {
        padding: 0 10px;
      }

      .nav-link span:not(.avatar) {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .navbar {
        gap: 12px;
      }

      .nav-links {
        gap: 0;
      }

      .nav-link {
        padding: 0 8px;
      }

      .site-brand {
        font-size: 20px;
        gap: 8px;
      }

      .brand-logo {
        width: 32px;
        height: 32px;
      }

      .avatar {
        width: 36px;
        height: 36px;
        font-size: 16px;
      }
    }
  </style>

  {% block head %}{% endblock %}
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">

      <!-- AXIODY logo -->
      <a class="site-brand" href="{{ home_url | default('/') }}" aria-label="AXIODY home">
        <svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="axiodyLogoBlue1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0b72f0"/>
              <stop offset="100%" stop-color="#0854c7"/>
            </linearGradient>
            <linearGradient id="axiodyLogoBlue2" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#1f8cff"/>
              <stop offset="100%" stop-color="#1266dc"/>
            </linearGradient>
          </defs>

          <path d="M31.5 5 8 47.5h14.2L32 29.7l10.1 17.8H56L32.6 5Z"
                fill="url(#axiodyLogoBlue1)"/>
          <path d="M17.5 47.5 25 60h14l7.3-12.5H32Z"
                fill="url(#axiodyLogoBlue2)"/>
        </svg>

        <span>AXIODY</span>
      </a>

      <!--
        Set active_page in each child template:
        home, submit, notifications, settings
      -->
      <ul class="nav-links">

        <!-- Home -->
        <li>
          <a class="nav-link"
             href="{{ home_url | default('/') }}"
             {% if active_page | default('') == 'home' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 11.5 12 4l9 7.5"/>
              <path d="M5.5 10v10h13V10"/>
              <path d="M9.5 20v-6h5v6"/>
            </svg>
            <span>Home</span>
          </a>
        </li>

        <!-- Submit -->
        <li>
          <a class="nav-link"
             href="{{ submissions_url | default('/submissions') }}"
             {% if active_page | default('') == 'submit' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3h8l4 4v14H6Z"/>
              <path d="M14 3v5h5"/>
            </svg>
            <span>Submit</span>
          </a>
        </li>

        <!-- Notifications -->
        <li>
          <a class="nav-link"
             href="{{ notifications_url | default('/notifications') }}"
             {% if active_page | default('') == 'notifications' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 6-3 7-3 9h18c0-2-3-3-3-9"/>
              <path d="M10 21h4"/>
            </svg>
            <span>Notifications</span>
          </a>
        </li>

        <!-- Settings -->
        <li>
          <a class="nav-link"
             href="{{ settings_url | default('/settings') }}"
             {% if active_page | default('') == 'settings' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/>
            </svg>
            <span>Settings</span>
          </a>
        </li>

        <!-- User avatar -->
        <li>
          <a class="nav-link avatar-link"
             href="{{ profile_url | default('/profile') }}"
             aria-label="Open profile">
            <span class="avatar" aria-hidden="true">
              {{ username | default('U', true) | first | upper }}
            </span>
          </a>
        </li>

      </ul>
    </nav>
  </header>

  <main id="main-content" class="site-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; {{ year | default(2026) }} <span>AXIODY</span></p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
